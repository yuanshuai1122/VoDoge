name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Local CI Entry Point
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vohive
          POSTGRES_PASSWORD: vohive
          POSTGRES_DB: vohive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vohive -d vohive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 数据库测试必需；未设置时 db.OpenTestDB 会整体 t.Skip
      TEST_DATABASE_URL: "host=127.0.0.1 user=vohive password=vohive dbname=vohive port=5432 sslmode=disable TimeZone=UTC"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Run local CI entry point
        run: make ci
