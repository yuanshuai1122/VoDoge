name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/yuanshuai1122/vodoge
  GO_VERSION: "1.26"
  CGO_ENABLED: "0"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend
        run: |
          npm ci --prefix web
          npm run build --prefix web -- --webpack
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -R web/dist/. internal/web/dist/
          touch internal/web/dist/.gitkeep
      - name: Linux binaries
        env:
          GOOS: linux
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          BUILD_TIME="$(date '+%Y-%m-%d %H:%M:%S')"
          LDFLAGS="-s -w -X 'github.com/yuanshuai1122/vodoge/internal/global.Version=${VERSION}' -X 'github.com/yuanshuai1122/vodoge/internal/global.BuildTime=${BUILD_TIME}'"
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" -ldflags "$LDFLAGS" -o "dist/vodoge_${VERSION}_linux_amd64" ./cmd/vodoge
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" -ldflags "$LDFLAGS" -o "dist/vodoge_${VERSION}_linux_arm64" ./cmd/vodoge
          CGO_ENABLED=0 GOARCH=arm GOARM=7 go build -trimpath -buildvcs=false -tags "with_utls nomsgpack" -ldflags "$LDFLAGS" -o "dist/vodoge_${VERSION}_linux_armv7" ./cmd/vodoge
          cp scripts/install.sh dist/install.sh
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum \
            "vodoge_${GITHUB_REF_NAME}_linux_amd64" \
            "vodoge_${GITHUB_REF_NAME}_linux_arm64" \
            "vodoge_${GITHUB_REF_NAME}_linux_armv7" \
            install.sh > SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vodoge_${{ github.ref_name }}_linux_amd64
            dist/vodoge_${{ github.ref_name }}_linux_arm64
            dist/vodoge_${{ github.ref_name }}_linux_armv7
            dist/install.sh
            dist/SHA256SUMS
