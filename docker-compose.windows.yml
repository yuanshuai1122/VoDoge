# Windows / Docker Desktop 本地部署
# 用法: docker compose -f docker-compose.windows.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: vodog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vodog
      POSTGRES_PASSWORD: vodog
      POSTGRES_DB: vodog
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vodog -d vodog"]
      interval: 5s
      timeout: 5s
      retries: 10

  vodog:
    image: ${VODOG_IMAGE:-ghcr.io/yuanshuai1122/vodog:latest}
    container_name: vodog
    restart: unless-stopped
    ports:
      - "7575:7575"
    privileged: true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.yaml
      - VODOG_DB_DSN=host=postgres user=vodog password=vodog dbname=vodog port=5432 sslmode=disable TimeZone=UTC
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
