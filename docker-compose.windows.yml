# Windows / Docker Desktop 本地部署
# 用法: docker compose -f docker-compose.windows.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: vohive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vohive
      POSTGRES_PASSWORD: vohive
      POSTGRES_DB: vohive
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vohive -d vohive"]
      interval: 5s
      timeout: 5s
      retries: 10

  vohive:
    image: vohive:latest
    container_name: vohive
    restart: unless-stopped
    ports:
      - "7575:7575"
    privileged: true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.yaml
      - VOHIVE_DB_DSN=host=postgres user=vohive password=vohive dbname=vohive port=5432 sslmode=disable TimeZone=UTC
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
