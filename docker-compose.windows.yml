# Windows / Docker Desktop 本地部署
# 用法: docker compose -f docker-compose.windows.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: vodoge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vodoge
      POSTGRES_PASSWORD: vodoge
      POSTGRES_DB: vodoge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vodoge -d vodoge"]
      interval: 5s
      timeout: 5s
      retries: 10

  vodoge:
    image: ${VODOGE_IMAGE:-${VODOG_IMAGE:-ghcr.io/yuanshuai1122/vodoge:latest}}
    container_name: vodoge
    restart: unless-stopped
    ports:
      - "7575:7575"
    privileged: true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.yaml
      - VODOGE_DB_DSN=host=postgres user=vodoge password=vodoge dbname=vodoge port=5432 sslmode=disable TimeZone=UTC
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
