# VoDoge 配置示例
#
# 用法：
#   cp config/config.example.yaml config/config.yaml
# 然后按需修改。config/config.yaml 不纳入版本控制（见 .gitignore）。
#
# 通知渠道（Telegram / 飞书 / QQ / Bark / Email / PushPlus / Webhook）
# 建议在 Web 界面「系统设置 → 通知」中配置并落盘，此处不再重复罗列。

server:
  port: 7575
  # 插件页面与后端的独立 origin；不得与管理端口相同。
  plugin_port: 7576
  # 公网反向代理终止 TLS 时，填写浏览器实际访问的两个 origin（不要带尾斜杠）。
  # 两者必须是不同的 http/https origin；留空时才根据请求回退推导。
  public_url: ""
  plugin_public_url: ""
  debug: false
  # 最多可添加的设备数（模组 + 读卡器）。默认 5，允许 1–10。也可在网页「系统设置」里改。
  max_devices: 5
  # 本机自签 HTTPS，与 HTTP 共用同一端口。证书在 data/tls/。也可在网页「系统设置」里开关。
  self_signed_https: false
  # 管理面来源限制。internal=只放行内网；public=不限制。也可在网页「系统设置」里改。
  access:
    mode: internal
    allowed_cidrs: []
    # 仅当服务只能经可信反向代理访问时启用；显式配置上述 origin 时通常无需启用。
    trust_proxy_headers: false

# 持久化：仅支持 PostgreSQL，无 SQLite 回退路径。
# DSN 为空或连接失败时进程直接退出。
# 优先级：VODOGE_DB_DSN > DATABASE_URL > 本文件 database.dsn
database:
  dsn: "host=127.0.0.1 user=vodoge password=vodoge dbname=vodoge port=5432 sslmode=disable TimeZone=UTC"
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 30m
  # 启动时执行 AutoMigrate；生产环境首启后可关闭
  auto_migrate: true

# Web 管理后台登录凭据，首次登录后请在界面中修改
web:
  username: admin
  password: admin123

# 全局短信发送限额：滚动 1 小时窗口，所有设备共用。
# 0 表示不限制。接收不占用额度。也可在网页「系统设置」里改。
sms:
  hourly_limit: 20

# 设备由网页「添加设备」写入。lane 是人工分线，不按 MCC 推断：
#   lane: cn    # 国内线
#   lane: intl  # 国外线
# 留空表示未分线。改 lane 不必重启模组。
