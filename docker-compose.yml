services:
  postgres:
    image: postgres:16-alpine
    container_name: vodog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vodog
      POSTGRES_PASSWORD: ${VODOG_POSTGRES_PASSWORD:-${VOHIVE_POSTGRES_PASSWORD:-vodog}}
      POSTGRES_DB: vodog
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vodog -d vodog"]
      interval: 5s
      timeout: 5s
      retries: 10

  vodog:
    build:
      context: .
      dockerfile: Dockerfile
    image: vodog:latest
    container_name: vodog
    restart: unless-stopped
    network_mode: "host"
    privileged: true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - /dev:/dev
    environment:
      - TZ=Asia/Shanghai
      - VODOG_DB_DSN=host=127.0.0.1 user=vodog password=${VODOG_POSTGRES_PASSWORD:-${VOHIVE_POSTGRES_PASSWORD:-vodog}} dbname=vodog port=5432 sslmode=disable TimeZone=UTC
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
