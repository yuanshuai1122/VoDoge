services:
  postgres:
    image: postgres:16-alpine
    container_name: vodoge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vodoge
      POSTGRES_PASSWORD: ${VODOGE_POSTGRES_PASSWORD:-${VODOG_POSTGRES_PASSWORD:-${VOHIVE_POSTGRES_PASSWORD:-vodoge}}}
      POSTGRES_DB: vodoge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vodoge -d vodoge"]
      interval: 5s
      timeout: 5s
      retries: 10

  vodoge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${VODOGE_IMAGE:-${VODOG_IMAGE:-ghcr.io/yuanshuai1122/vodoge:latest}}
    container_name: vodoge
    restart: unless-stopped
    network_mode: "host"
    privileged: true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - /dev:/dev
    environment:
      - TZ=Asia/Shanghai
      - VODOGE_DB_DSN=host=127.0.0.1 user=vodoge password=${VODOGE_POSTGRES_PASSWORD:-${VODOG_POSTGRES_PASSWORD:-${VOHIVE_POSTGRES_PASSWORD:-vodoge}}} dbname=vodoge port=5432 sslmode=disable TimeZone=UTC
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
