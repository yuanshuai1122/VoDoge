# Docker Compose 配置 - 使用 GHCR 预构建镜像
# 镜像地址: ghcr.io/yuanshuai1122/vohive
# 用法: docker-compose -f docker-compose.hub.yml up -d
# 需要 PostgreSQL（本文件内自带 postgres 服务）

services:
  postgres:
    image: postgres:16-alpine
    container_name: vohive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vohive
      POSTGRES_PASSWORD: vohive
      POSTGRES_DB: vohive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vohive -d vohive"]
      interval: 5s
      timeout: 5s
      retries: 10

  vohive:
    image: ${VOHIVE_IMAGE:-ghcr.io/yuanshuai1122/vohive:latest}
    container_name: vohive
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - /dev:/dev
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/app/config/config.yaml
      - VOHIVE_DB_DSN=host=127.0.0.1 user=vohive password=vohive dbname=vohive port=5432 sslmode=disable TimeZone=UTC
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
