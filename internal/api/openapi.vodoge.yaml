        message:
          type: string

    SMSSendResponse:
      type: object
      description: |
        提示语在 `meta.message`。
        `message_id` 仅 VoWiFi 通道会生成，AT 通道为空字符串。
      properties:
        device:
          type: string
        phone:
          type: string
        message_id:
