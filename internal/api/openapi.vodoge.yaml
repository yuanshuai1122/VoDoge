    E911WebsheetResponse:
      type: object
      required: [id, embedUrl, url, method]
      properties:
        id:
          type: string
          description: websheet 会话 id，用于 /websheets/{id}/status。
        embedUrl:
          type: string
          description: |
            供浏览器打开的承载页地址，已带该会话专属的一次性 token。
            注意本字段是 camelCase，与全局 snake_case 相反。
          example: /api/websheets/9f2c.../?token=...
        title:
          type: string
        url:
          type: string
          description: 运营商目标地址，仅供展示"将要访问哪里"。
        method:
          type: string
          enum: [GET, POST]
          description: 承载页对目标地址使用的方法，由运营商返回的内容类型决定。

    WebsheetStatus:
