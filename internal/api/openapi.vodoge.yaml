openapi: 3.0.3
info:
  title: VoDoge Main API
  version: 1.0.0-main
  description: |
    VoDoge 主服务控制面 API。
    - 服务器前缀：`/api`
    - 登录方式：`POST /auth/login`
    - 受保护接口统一使用 `Authorization: Bearer <token>`
    - 文档页面：`GET /docs`
servers:
  - url: /api
    description: VoDoge main API prefix
security:
  - BearerAuth: []
tags:
  - name: auth
    description: 登录、会话与 IP 轮换
  - name: dashboard
    description: 仪表盘与全局状态
  - name: sms
    description: 短信收发与会话
  - name: settings
    description: 系统信息、密码、短信限额与通知设置
  - name: devices
    description: 设备配置、控制与运维
  - name: readers
    description: USB CCID 读卡器发现（写卡第 3 期）
  - name: proxy-instances
    description: 本地代理实例管理
  - name: upstream-proxies
    description: 前置代理与国家规则
  - name: esim
    description: eSIM 与 eUICC 管理
  - name: vowifi
    description: VoWiFi 控制
  - name: logs
    description: 日志历史与实时流
  - name: extensions
    description: 插件安装、启停与卸载
paths:
  /docs:
    get:
      tags: [settings]
      summary: Swagger UI 文档页
      description: |
        公开可访问的文档壳页面。
        页面本身不要求 Bearer 鉴权，但会在浏览器内读取 `localStorage.token`，
        再用 Bearer 方式请求 `/openapi.json` 并给 Try it out 自动注入认证头。
      security: []
      responses:
        '200':
          description: HTML 页面
          content:
            text/html:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [settings]
      summary: 获取 OpenAPI YAML
      responses:
        '200':
          description: OpenAPI YAML 文档
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /openapi.json:
    get:
      tags: [settings]
      summary: 获取 OpenAPI JSON
      responses:
        '200':
          description: OpenAPI JSON 文档
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/ErrorMessage'

  /rotateip:
    post:
      tags: [auth]
      summary: 执行公网 IP 轮换
      description: |
        支持两种鉴权方式：
        1. Bearer token
        2. 请求体或表单里的 `username/password`
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RotateRequest'
      parameters:
        - in: query
          name: device_id
          schema:
            type: string
          description: 优先级高于请求体中的 device_id
      responses:
        '200':
          description: 轮换结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RotateResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /dashboard/devices:
    get:
      tags: [dashboard]
      summary: 仪表盘设备概览
      responses:
        '200':
          description: 设备卡片列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DashboardDevice'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{device_id}/status:
    get:
      tags: [dashboard]
      summary: 单设备详细状态
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      responses:
        '200':
          description: 详细状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceStatusDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /health:
    get:
      tags: [dashboard]
      summary: 服务健康检查
      responses:
        '200':
          description: 所有设备健康
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 至少一个设备不健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /traffic/analysis:
    get:
      tags: [dashboard]
      summary: 流量统计分析
      parameters:
        - in: query
          name: range
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
        - in: query
          name: device_id
          schema:
            type: string
      responses:
        '200':
          description: 聚合流量与图表数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrafficAnalysisResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sms/send:
    post:
      tags: [sms]
      summary: 发送短信
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SMSSendRequest'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SMSSendResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '429':
          description: 全局发送限额已满（code=sms_rate_limited）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /sms/delivery/{message_id}:
    get:
      tags: [sms]
      summary: 查询短信投递状态
      parameters:
        - in: path
          name: message_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 投递状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SMSDeliveryResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /sms/contacts:
    get:
      tags: [sms]
      summary: 短信联系人会话列表
      parameters:
        - in: query
          name: device_id
          schema:
            type: string
        - in: query
          name: imsi
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: before_ts
          schema:
            type: string
            format: date-time
        - in: query
          name: before_peer
          schema:
            type: string
        - in: query
          name: lane
          description: 按设备线路过滤会话。空或不传表示全部；仅允许 cn 或 intl。
          schema:
            type: string
            enum: [cn, intl]
      responses:
        '200':
          description: 联系人列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SMSContact'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /sms/thread:
    get:
      tags: [sms]
      summary: 获取与指定对端的短信会话
      parameters:
        - in: query
          name: device_id
          schema:
            type: string
        - in: query
          name: imsi
          schema:
            type: string
        - in: query
          name: peer
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: before_ts
          schema:
            type: string
            format: date-time
        - in: query
          name: before_id
          schema:
            type: integer
      responses:
        '200':
          description: 短信会话消息列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SMSMessage'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'
    delete:
      tags: [sms]
      summary: 永久删除指定短信会话历史
      description: 仅删除短信中心历史记录，不删除设备侧短信槽位
      parameters:
        - in: query
          name: device_id
          schema:
            type: string
        - in: query
          name: imsi
          schema:
            type: string
        - in: query
          name: peer
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                          deleted:
                            type: integer
                          imsi:
                            type: string
                          peer:
                            type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /sms/messages/{id}:
    delete:
      tags: [sms]
      summary: 永久删除单条短信历史
      description: 仅删除短信中心历史记录，不删除设备侧短信槽位
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                          thread_empty:
                            type: boolean
                          imsi:
                            type: string
                          peer:
                            type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications:
    get:
      tags: [settings]
      summary: 获取通知设置
      responses:
        '200':
          description: 当前通知配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NotificationSettings'
    put:
      tags: [settings]
      summary: 保存通知设置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationSettingsRequest'
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AppliedResult'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/notifications/webhook/test:
    post:
      tags: [settings]
      summary: 使用当前 Webhook 配置发送测试通知（不落盘）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestWebhookRequest'
      responses:
        '200':
          description: 测试发送结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TestWebhookResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/password:
    post:
      tags: [settings]
      summary: 修改登录密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/sms:
    get:
      tags: [settings]
      summary: 获取全局短信发送限额
      description: |
        滚动 1 小时窗口，所有设备共用。`hourly_limit=0` 表示不限制发送。
        接收短信不占用额度。
      responses:
        '200':
          description: 当前限额与窗口用量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SMSSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [settings]
      summary: 更新全局短信发送限额
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSMSSettingsRequest'
      responses:
        '200':
          description: 更新后的限额与窗口用量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SMSSettings'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/devices:
    get:
      tags: [settings]
      summary: 获取设备配额
      description: 当前允许配置的设备上限。调低不会删除已有设备。
      responses:
        '200':
          description: 配额与已用数量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceQuota'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [settings]
      summary: 更新设备配额
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceQuotaRequest'
      responses:
        '200':
          description: 更新后的配额
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceQuota'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /settings/https:
    get:
      tags: [settings]
      summary: 获取本机自签 HTTPS 状态
      description: |
        关闭时也返回证书指纹，方便先下载并信任再打开开关。
        开启后 HTTP 会 308 到 HTTPS；本接口与证书下载仍可走明文，以免锁死。
      responses:
        '200':
          description: 当前开关与证书指纹
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HTTPSSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ErrorMessage'
    put:
      tags: [settings]
      summary: 开关本机自签 HTTPS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHTTPSSettingsRequest'
      responses:
        '200':
          description: 更新后的状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HTTPSSettings'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ErrorMessage'
        '503':
          $ref: '#/components/responses/ErrorMessage'

  /settings/https/certificate:
    get:
      tags: [settings]
      summary: 下载本机自签证书
      responses:
        '200':
          description: PEM 证书
          content:
            application/x-pem-file:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ErrorMessage'

  /settings/security:
    get:
      tags: [settings]
      summary: 获取网络访问策略
      description: |
        默认 `internal`：只放行内网网段。`public` 不限制来源。
        `client_ip` / `client_allowed` 反映这次请求的判定结果。
      responses:
        '200':
          description: 当前策略与本次连接判定
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SecuritySettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [settings]
      summary: 更新网络访问策略
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecuritySettingsRequest'
      responses:
        '200':
          description: 更新后的策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SecuritySettings'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /extensions:
    get:
      tags: [extensions]
      summary: 已安装插件
      responses:
        '200':
          description: 插件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/InstalledPlugin'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /extensions/install-url:
    post:
      tags: [extensions]
      summary: 从 HTTPS URL 安装插件
      description: |
        只接受 HTTPS，且解析后的地址不能是内网 / 回环。
        `sha256` 可选，给出时必须与包内容一致。
        插件以当前管理员权限运行，只安装完全信任的包。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallPluginURLRequest'
      responses:
        '201':
          description: 已安装并启用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InstalledPlugin'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /extensions/upload:
    post:
      tags: [extensions]
      summary: 上传插件包
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: string
                  format: binary
      responses:
        '201':
          description: 已安装并启用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InstalledPlugin'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /extensions/{id}:
    put:
      tags: [extensions]
      summary: 启用或禁用插件
      parameters:
        - name: id
          in: path
          required: true
