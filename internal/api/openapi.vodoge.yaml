        sender:
          type: string
        recipient:
          type: string
        content:
          type: string
        type:
          type: integer
        status:
          type: integer
        timestamp:
          type: string
          format: date-time
        device_name:
          type: string

    SMSContact:
      type: object
      properties:
        imsi:
          type: string
        peer:
          type: string
        last_sms_id:
          type: integer
        last_timestamp:
          type: string
          format: date-time
        last_content:
          type: string
        last_type:
          type: integer
        unread_count:
          type: integer
        device_id:
          type: string
        device_name:
          type: string
        local_phone:
          type: string
        lane:
          type: string
          enum: [cn, intl]
          description: 会话所属设备的线路；设备未在线或未分线时可能为空

    TelegramSettings:
      type: object
      properties:
        enabled:
          type: boolean
        bot_token:
          type: string
        chat_id:
          type: integer
          format: int64
        admin_id:
          type: integer
          format: int64
        base_url:
          type: string
        proxy:
          type: string

