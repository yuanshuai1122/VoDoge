            `upstream_proxy_disabled` 代理未启用；
            `profile_already_bound` 该 ICCID 已绑到别的代理。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [upstream-proxies]
      summary: 解除 Profile 前置代理绑定
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProfileProxyBindingsRequest'
      responses:
        '200':
          description: 已解除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim:
    get:
      tags: [esim]
      summary: 获取 eSIM 总览
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      responses:
