                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EsimProfile'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim/notifications:
    get:
      tags: [esim]
      summary: 获取当前 eSIM 通知列表
      description: |
        返回当前 eUICC 仍保留的通知列表，仅表示当前可见状态，不承诺完整历史审计。
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
        - in: query
          name: aid_hex
          schema:
            type: string
          description: 可选的目标 eUICC AID，缺省时使用默认 ISD-R AID。
      responses:
        '200':
          description: 当前通知列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EsimNotificationListResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim/notifications/{sequence}/actions/retry:
    post:
      tags: [esim]
      summary: 重试发送当前 eSIM 通知
      description: |
        对当前仍可 retrieve 的 pending notification 执行一次手动重试发送。
        成功只表示本次重试发送已提交；该接口不提供通知历史审计。
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
        - in: path
          name: sequence
          required: true
          schema:
            type: integer
            format: int64
          description: 通知序号。
        - in: query
          name: aid_hex
          schema:
            type: string
          description: 可选的目标 eUICC AID，缺省时使用默认 ISD-R AID。
      responses:
        '200':
          description: 通知重试发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim/actions/switch:
    post:
      tags: [esim]
      summary: 切换 eSIM Profile
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsimSwitchRequest'
      responses:
        '200':
          description: 切换已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EsimSwitchResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim/actions/disable:
    post:
      tags: [esim]
      summary: 禁用当前 eSIM Profile
      description: |
        禁用指定 ICCID。禁用后该 eUICC 没有活动号码，蜂窝/短信会中断，直到再启用一张。
        卡或模组拒绝时返回错误，不装成成功。
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsimSwitchRequest'
      responses:
        '200':
          description: 禁用已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim/eids:
    get:
      tags: [esim]
      summary: 获取设备 EID 列表
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      responses:
        '200':
          description: EID 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EsimEIDsResponse'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim/chip-info:
    get:
      tags: [esim]
      summary: 获取 eUICC 芯片信息
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
        - in: query
          name: refresh
          schema:
            type: boolean
      responses:
        '200':
          description: 芯片信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EsimChipInfo'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim/actions/download:
    post:
      tags: [esim]
      summary: 发起 eSIM Profile 下载
      description: |
        创建一个后台下载任务并立即返回 `task_id`，随后用
        `GET /devices/{device_id}/esim/actions/download/stream?task_id=...` 订阅进度。

        激活参数（`matching_id` / `confirmation_code`）只经请求体提交，不出现在 URL 中：
        它们通常一次性且可被抢用，进入浏览器历史、Referer 或中间层访问日志是不可接受的暴露面。

        下载不与订阅连接绑定——断线后用同一个 `task_id` 重新订阅即可，已产生的事件会被补发。
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsimDownloadRequest'
      responses:
        '202':
          description: 任务已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EsimDownloadTaskAccepted'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          description: |
            该设备已有进行中的下载任务。`error.code` 为 `ESIM_DOWNLOAD_IN_PROGRESS`，
            `error.details.task_id` 是那个任务的 id——**可直接订阅它的进度流**，
            前端应当把这种情况当作正常结果而不是错误（用户重复点击、刷新页面
            都会走到这条路径）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /devices/{device_id}/esim/actions/download/stream:
    get:
      tags: [esim]
      summary: 订阅 eSIM Profile 下载进度（SSE）
      description: |
        返回 `text/event-stream`。订阅时先补发该任务已产生的全部事件，再推送后续事件。
        每条 `data` 负载格式为：
        `{"step":"preflight|auth_client|auth_server|install|notify|done|error","msg":"...","pct":10}`
        当最终 `step=done` 但通知未完全确认时，会额外附带 `warning` / `warning_code`；
        `step=error` 时可能附带 `code` / `details`。流在终态事件后结束。
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
        - in: query
          name: task_id
          required: true
          schema:
            type: string
          description: POST 下载接口返回的任务 id
      responses:
        '200':
          description: SSE 下载进度流
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/esim/profiles/{iccid}:
    patch:
      tags: [esim]
      summary: 重命名 eSIM Profile
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
        - $ref: '#/components/parameters/ICCIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsimRenameProfileRequest'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'
    delete:
      tags: [esim]
      summary: 删除 eSIM Profile
      description: |
        删除指定的 eSIM Profile。
        `200` 表示 Profile 删除成功；若删除通知未完全确认不会改变该状态码，响应体会附带 `warning` / `warning_code`。
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
        - $ref: '#/components/parameters/ICCIDPath'
        - in: query
          name: aid_hex
          schema:
            type: string
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/StatusResponse'
                          - type: object
                            properties:
                              warning:
                                type: string
                              warning_code:
                                type: string
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/vowifi:
    patch:
      tags: [vowifi]
      summary: 设置设备 VoWiFi 启停状态
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnabledStateRequest'
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeviceStatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/vowifi/actions/reconnect:
    post:
      tags: [vowifi]
      summary: 触发设备 VoWiFi 重连
      parameters:
        - $ref: '#/components/parameters/DeviceIDPath'
      responses:
        '200':
          description: 已触发重连
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /logs/stream:
    get:
      tags: [logs]
      summary: 实时日志 SSE 流
      description: |
        返回 `text/event-stream`。
        - 初始化时会发送一次 `connected` 事件
        - 后续事件名为 `log`
        - `level` 过滤规则：`debug >= info >= warn >= error`
      parameters:
        - in: query
          name: level
          schema:
            type: string
            enum: [debug, info, warn, error]
      responses:
        '200':
          description: SSE 日志流
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    options:
      tags: [logs]
      summary: 日志流 CORS 预检
      description: |
        开发期前端直连后端（绕开会缓冲 SSE 的 Next dev 代理）时用到。
        免鉴权——预检请求本就不带凭证。
      responses:
        '204':
          description: 允许跨源访问

  /logs/history:
    get:
      tags: [logs]
      summary: 获取历史日志
      parameters:
        - in: query
          name: lines
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        '200':
          description: 历史日志列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LogHistoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cards/policies:
    get:
      tags: [devices]
      summary: 列出全部卡策略
      description: 策略以 ICCID 为主键，与设备解耦；换卡后策略跟随卡片。
      responses:
        '200':
          description: 卡策略列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          policies:
                            type: array
                            items:
                              $ref: '#/components/schemas/CardPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cards/{iccid}/policy:
    parameters:
      - in: path
        name: iccid
        required: true
        schema:
          type: string
    get:
      tags: [devices]
      summary: 读取指定卡的策略
      description: 策略不存在时返回默认策略而非 404。响应为裸对象，无包装。
      responses:
        '200':
          description: 卡策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CardPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [devices]
      summary: 保存指定卡的策略
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPolicy'
      responses:
        '200':
          description: 保存后的策略
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CardPolicy'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{device_id}/overview/stream:
    parameters:
      - in: path
        name: device_id
        required: true
        schema:
          type: string
      - in: query
        name: token
        required: false
        description: |
          浏览器原生 EventSource 无法设置请求头，故本端点额外接受 query 传参。
          Authorization 头优先；仅在无该头时才读取此参数。
        schema:
          type: string
    get:
      tags: [devices]
      summary: 设备概览实时流 (SSE)
      description: |
        `text/event-stream`。事件名与载荷：
        - `overview` → `{devices: [DeviceMgmtOverviewLiteItem]}`（单元素数组）
        - `traffic` → 实时流量快照
        - `ussd` → USSD 会话事件
        10 秒心跳，另在 VoWiFi 状态变化时立即推送。
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{device_id}/actions/ussd/continue:
    parameters:
      - in: path
        name: device_id
        required: true
        schema:
          type: string
    post:
      tags: [devices]
      summary: USSD 多轮会话续轮
      description: session_id 取自上一轮响应的 result.session_id。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueUSSDRequest'
      responses:
        '200':
          description: 本轮结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ExecuteUSSDResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/actions/ussd/cancel:
    parameters:
      - in: path
        name: device_id
        required: true
        schema:
          type: string
    post:
      tags: [devices]
      summary: 取消 USSD 会话
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelUSSDRequest'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/operator_selection:
    parameters:
      - in: path
        name: device_id
        required: true
        schema:
          type: string
    get:
      tags: [devices]
      summary: 读取当前选网配置
      responses:
        '200':
          description: 当前选网
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorSelection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'
    post:
      tags: [devices]
      summary: 锁定运营商或恢复自动选网
      description: 锁网会触发重新搜网，可能耗时较长。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOperatorSelectionRequest'
      responses:
        '200':
          description: 设置后的选网
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorSelection'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/operator_selection/scan:
    parameters:
      - in: path
        name: device_id
        required: true
        schema:
          type: string
    get:
      tags: [devices]
      summary: 扫描可用运营商（一次性返回）
      description: 扫描期间模组会脱网，可能持续 1–2 分钟。需要边扫边看请用 /scan/stream。
      responses:
        '200':
          description: 扫描结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OperatorScanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'

  /devices/{device_id}/operator_selection/scan/stream:
    parameters:
      - in: path
        name: device_id
        required: true
        schema:
          type: string
      - in: query
        name: token
        required: false
        description: 同 overview/stream，供 EventSource 使用。
        schema:
          type: string
    get:
      tags: [devices]
      summary: 扫描可用运营商 (SSE)
      description: |
        `text/event-stream`，事件名 `operator_scan`，载荷为 OperatorScanResponse，
        随扫描推进多次推送，直至 complete 为 true。
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /devices/{device_id}/vowifi/e911/websheet:
    parameters:
      - in: path
        name: device_id
        required: true
        schema:
          type: string
    post:
      tags: [devices]
      summary: 创建 E911 设置 websheet 会话
      description: |
        返回一个由本服务反向代理运营商页面的会话地址，供浏览器打开完成 E911 地址登记。
        承载页与代理路径（`/websheets/{id}`、`/websheets/{id}/proxy/...`）属内部通道，
        请求与响应完全由运营商页面决定，不在本文档描述范围内；
        判断流程是否结束请轮询 `GET /websheets/{id}/status`。

        `embedUrl` 已带该会话专属的一次性 token，可直接在新窗口打开。
      responses:
        '201':
          description: 会话已创建
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/E911WebsheetResponse'
        '400':
          description: 当前运营商未启用 E911（`e911_not_supported` / `e911_provider_unavailable`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '409':
          description: 读不到 IMSI/IMEI 等身份信息（`e911_identity_unavailable`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: 运营商未返回 websheet 地址（`e911_websheet_unavailable`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /websheets/{id}/status:
    get:
      tags: [devices]
      summary: 查询 websheet 会话状态
      description: |
        承载表单跑在运营商域下，跨源既读不到内容也收不到关闭事件——流程是否结束
        只有服务端知道（桥接脚本会回调本服务）。前端通过轮询本端点获知终态。

        凭证可用会话自己的 token（`?token=` 或 `X-Websheet-Token` 头），
        也可用已登录用户的 `Authorization` 头。

        会话在结束后仍保留至 TTL 到期，以便客户端取回终态；过期后返回 410。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 会话状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebsheetStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ErrorMessage'
        '410':
          description: 会话已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /settings/notifications/bark/test:
    post:
      tags: [settings]
      summary: 发送 Bark 测试通知
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings/notifications/email/test:
    post:
      tags: [settings]
      summary: 发送邮件测试通知
      responses:
        '200':
          description: 已发送
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /system/update/check:
    get:
      tags: [settings]
      summary: 检查是否有新版本
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UpdateCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /system/update/apply:
    post:
      tags: [settings]
      summary: 应用更新
      description: 会替换程序并重启服务，当前连接将中断。
      responses:
        '200':
          description: 已触发更新
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ErrorMessage'

  /system/uninstall:
    post:
      tags: [settings]
      summary: 卸载并自毁
      description: |
        **破坏性且不可撤销**：停止服务、删除数据目录与配置文件。
        需要鉴权（早期版本曾无校验，见 docs/known-issues.md）。
      responses:
        '200':
          description: 已开始卸载
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageOnlyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SessionToken

  parameters:
    DeviceIDPath:
      in: path
      name: device_id
      required: true
      schema:
        type: string
      description: 设备 ID
    InstanceIDPath:
      in: path
      name: instance_id
      required: true
      schema:
        type: string
      description: 代理实例 ID
    UpstreamProxyIDPath:
      in: path
      name: proxy_id
      required: true
      schema:
        type: string
      description: 前置代理 ID
    CountryCodePath:
      in: path
      name: country_code
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 2
      description: ISO 3166-1 alpha-2 国家代码
    ICCIDPath:
      in: path
      name: iccid
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ErrorMessage:
      description: 错误信息
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Envelope:
      type: object
      description: |
        所有成功响应（2xx）的信封。

        `data` 恒存在（无资源可返回时为 `null`），`meta` 为空时不出现。
        `data` 与 `error` 互斥且必有其一——判别是结构性的，不再依赖
        `status:"ok"` 那种字符串（它曾经出现在 200 响应里表示失败）。

        **不套信封的三处**：SSE 事件帧（领域事件流，不是 HTTP 响应）、
        `GET /ping`（`/api` 之外的存活探针）、websheet 的承载页与代理通道
        （内容由运营商页面决定）。
      required: [data, request_id]
      properties:
        data:
          nullable: true
          description: 资源本身。集合为数组（空集合是 `[]`），纯动作为 `null`。
        meta:
          type: object
          additionalProperties: true
          description: |
            关于**这次操作**的说明，不是资源的一部分。常见键：

            - `message` 给人看的操作结果
            - `warning` / `warning_code` 操作成功但有保留
            - `requires_restart` / `started` / `applied` 生效状态
            - `device_limit` 集合的额度上限
            - `space_delta` eSIM 空间变化
            - `thread_empty` / `deleted` 删除的副作用
            - `channel` USSD 走的通路（vowifi / cs）
            - `range` 查询参数回显
        request_id:
          type: string
          description: 与服务端访问日志对应，排查时用它定位。

    ErrorEnvelope:
      type: object
      description: 所有错误响应（4xx/5xx）的信封。
      required: [error, request_id]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            供程序判别的稳定标识。多数端点用按 HTTP 状态推导的通用码
            （`bad_request` / `not_found` / `conflict` / `internal_error` …），
            **这些不值得分支**，用 HTTP 状态即可。需要客户端据以决策的场景有
            专属码：`ESIM_BUSY`、`ESIM_DOWNLOAD_IN_PROGRESS`、
            `e911_*`、`websheet_*`。
        message:
          type: string
          description: 给人读的说明，不要用于程序分支。
        details:
          type: object
          additionalProperties: true
          description: |
            需要客户端据以决策的结构化数据，与给人读的 message 分开。

            - 409 `ESIM_BUSY`：`busy` / `reason` / `retry_after_ms`（另有 `Retry-After` 头）
            - 409 `ESIM_DOWNLOAD_IN_PROGRESS`：`busy` / `task_id`（可直接订阅该任务）


    StatusResponse:
      type: object
      nullable: true
      description: |
        纯动作，没有资源可返回，`data` 恒为 `null`。
        操作结果的说明（`message`、`warning` 等）在信封的 `meta` 里。

    AppliedResult:
      type: object
      nullable: true
      description: |
        配置类动作，`data` 恒为 `null`。
        `meta.applied` 表示是否已实际生效；未生效时 `meta.warning` 说明原因
        （配置已写入但运行时初始化失败仍返回 2xx）。

    MessageOnlyResponse:
      type: object
      nullable: true
      description: |
        `data` 恒为 `null`，提示语在 `meta.message`。

    DocsLinks:
      type: object
      properties:
        swagger_ui:
          type: string
          example: /api/docs
        openapi_yaml:
          type: string
          example: /api/openapi.yaml
        openapi_json:
          type: string
          example: /api/openapi.json

    SystemInfoResponse:
      type: object
      properties:
        version:
          type: string
        build_time:
          type: string
        config:
          type: string
        docs:
          $ref: '#/components/schemas/DocsLinks'

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    RotateRequest:
      type: object
      properties:
        device_id:
          type: string
        device:
          type: string
        username:
          type: string
        password:
          type: string

    RotateResponse:
      type: object
      description: |
        换 IP 的结果。耗时与提示语在 `meta`（`duration` / `message`）。
      properties:
        device:
          type: string
        old_ip:
          type: string
        new_ip:
          type: string

    StringMap:
      type: object
      additionalProperties:
        type: string

    Int64Map:
      type: object
      additionalProperties:
        type: integer
        format: int64

    TrafficMeta:
      type: object
      properties:
        interface:
          type: string
        period_start:
          type: string
          format: date-time
        age_seconds:
          type: integer
          format: int64
        status:
          type: string
          enum: [ok, waiting_sample, stale]

    RealtimeTrafficSnapshot:
      type: object
      properties:
        device_id:
          type: string
        interface:
          type: string
        source:
          type: string
          enum: [qmi_wds]
        timestamp:
          type: string
          format: date-time
        interval_ms:
          type: integer
          format: int64
        rx_bps:
          type: integer
          format: int64
        tx_bps:
          type: integer
          format: int64
        rx_delta_bytes:
          type: integer
          format: int64
        tx_delta_bytes:
          type: integer
          format: int64
        total_rx_bytes:
          type: integer
          format: int64
        total_tx_bytes:
          type: integer
          format: int64
        status:
          type: string
          enum: [ok, waiting_sample, reset, error]
        error:
          type: string

    UnknownObject:
      type: object
      additionalProperties: true

    VoWiFiRuntime:
      type: object
      properties:
        device_id:
          type: string
        dataplane_mode:
          type: string
        sim_ready:
          type: boolean
        access_ready:
          type: boolean
        tunnel_ready:
          type: boolean
        ims_ready:
          type: boolean
        sms_ready:
          type: boolean
        reg_status:
          type: integer
        reg_status_text:
          type: string
        network_mode:
          type: string
        last_error_class:
          type: string
        last_error:
          type: string
        last_reason:
          type: string
        updated_at:
          type: string
          format: date-time

    PNNRecord:
      type: object
      properties:
        record:
          type: integer
        full_name:
          type: string
        short_name:
          type: string
        raw_hex:
          type: string

    OPLRecord:
      type: object
      properties:
        record:
          type: integer
        plmn:
          type: string
        lac_start:
          type: integer
        lac_end:
          type: integer
        pnn_record:
          type: integer
        raw_hex:
          type: string

    SIMServiceTable:
      type: object
      properties:
        kind:
          type: string
          enum: [UST, SST]
        raw_hex:
          type: string
        enabled_services:
          type: array
          items:
            type: integer

    ModemStatus:
      type: object
      properties:
        imei:
          type: string
        firmware:
          type: string
        iccid:
          type: string
        imsi:
          type: string
        native_spn:
          type: string
          description: SIM EF_SPN 解码得到的原始服务提供商名称，区别于当前驻网 operator。
        native_mcc:
          type: string
          description: SIM EF_AD/EF_IMSI 推导得到的原生 MCC，区别于当前驻网 MCC。
        native_mnc:
          type: string
          description: SIM EF_AD/EF_IMSI 推导得到的原生 MNC，区别于当前驻网 MNC。
        gid1:
          type: string
          description: SIM EF_GID1 原始十六进制内容。
        gid2:
          type: string
          description: SIM EF_GID2 原始十六进制内容。
        pnn:
          type: array
          items:
            $ref: '#/components/schemas/PNNRecord'
        opl:
          type: array
          items:
            $ref: '#/components/schemas/OPLRecord'
        sim_service_table:
          $ref: '#/components/schemas/SIMServiceTable'
        operator:
          type: string
        sim_inserted:
          type: boolean
        signal_dbm:
          type: integer
        signal_rsrp:
          type: integer
        signal_rsrq:
          type: integer
        signal_sinr:
          type: integer
          description: LTE SINR/RSSNR。
        nr5g_signal_sinr:
          type: integer
          description: NR5G SINR。
        radio_band:
          type: string
          description: 当前服务小区/无线接口的频段信息。
        radio_channel:
          type: integer
          format: uint32
          description: 当前服务小区/无线接口的 EARFCN/ARFCN/channel。
        reg_status:
          type: integer
        reg_status_text:
          type: string
        lac:
          type: string
        cell_id:
          type: string
        apn:
          type: string
        ims_status:
          type: integer
        network_mode:
          type: string
        usbnet_mode:
          type: integer
        operating_mode:
          type: integer
          nullable: true

    DashboardDevice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        interface:
          type: string
        proxy_port:
          type: integer
        public_ip:
          type: string
        healthy:
          type: boolean
        operator:
          type: string
        signal_dbm:
          type: integer
        network_mode:
          type: string
        vowifi_active:
          type: boolean
        vowifi_runtime:
          $ref: '#/components/schemas/VoWiFiRuntime'
        traffic:
          $ref: '#/components/schemas/StringMap'
        network_connected:
          type: boolean

    DeviceStatusDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imei:
          type: string
        firmware:
          type: string
        iccid:
          type: string
        imsi:
          type: string
        native_spn:
          type: string
          description: SIM EF_SPN 解码得到的原始服务提供商名称，区别于当前驻网 operator。
        native_mcc:
          type: string
          description: SIM EF_AD/EF_IMSI 推导得到的原生 MCC，区别于当前驻网 MCC。
        native_mnc:
          type: string
          description: SIM EF_AD/EF_IMSI 推导得到的原生 MNC，区别于当前驻网 MNC。
        gid1:
          type: string
          description: SIM EF_GID1 原始十六进制内容。
        gid2:
          type: string
          description: SIM EF_GID2 原始十六进制内容。
        pnn:
          type: array
          items:
            $ref: '#/components/schemas/PNNRecord'
        opl:
          type: array
          items:
            $ref: '#/components/schemas/OPLRecord'
        sim_service_table:
          $ref: '#/components/schemas/SIMServiceTable'
        operator:
          type: string
        sim_inserted:
          type: boolean
        signal_dbm:
          type: integer
        signal_rsrp:
          type: integer
        signal_rsrq:
          type: integer
        signal_sinr:
          type: integer
          description: LTE SINR/RSSNR。
        nr5g_signal_sinr:
          type: integer
          description: NR5G SINR。
        radio_band:
          type: string
          description: 当前服务小区/无线接口的频段信息。
        radio_channel:
          type: integer
          format: uint32
          description: 当前服务小区/无线接口的 EARFCN/ARFCN/channel。
        reg_status:
          type: integer
        reg_status_text:
          type: string
        lac:
          type: string
        cell_id:
          type: string
        apn:
          type: string
        ims_status:
          type: integer
        public_ip:
          type: string
        interface:
          type: string
        proxy_port:
          type: integer
        healthy:
          type: boolean
        network_connected:
          type: boolean
        traffic:
          $ref: '#/components/schemas/StringMap'
        vowifi:
          $ref: '#/components/schemas/UnknownObject'

    HealthDevice:
      type: object
      properties:
        healthy:
          type: boolean
        modem_ok:
          type: boolean
        iface_up:
          type: boolean
        network_connected:
          type: boolean
        signal:
          type: integer

    HealthResponse:
      type: object
      description: |
        恒返回 200——"有设备不健康"不是这次请求失败。
        整体判据是 `healthy`，逐设备明细在 `devices`。
        按状态码判活请用免鉴权的 `GET /ping`。
      required: [healthy, devices]
      properties:
        healthy:
          type: boolean
          description: 所有设备均健康时为 true。
        devices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/HealthDevice'

    TrafficAnalysisResponse:
      type: object
      description: |
        `range` 只是把请求参数回显回来，在信封的 `meta.range` 里，不在 data。
      properties:
